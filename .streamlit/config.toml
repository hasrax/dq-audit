# Calm theme in two modes; viewers switch with the menu (⋮ > Settings).
# Colour carries meaning (see dashboard/theme.py): sage = good,
# mustard = warning, coral = high severity, lavender = AI, blue = rules.
# Accent shades differ per mode so text keeps AA contrast.

[theme]
font = "sans-serif"
baseFontSize = 16
baseRadius = "large"
showWidgetBorder = true

[theme.dark]
primaryColor = "#8FC9B4"
backgroundColor = "#16181D"
secondaryBackgroundColor = "#272B34"
textColor = "#EEF0F4"
linkColor = "#86AEF7"
borderColor = "#343A46"

[theme.dark.sidebar]
backgroundColor = "#1A1C22"
secondaryBackgroundColor = "#272B34"

[theme.light]
primaryColor = "#286B55"
backgroundColor = "#F7F6F2"
secondaryBackgroundColor = "#EFEDE6"
textColor = "#1E2127"
linkColor = "#2B5CB8"
borderColor = "#E3E0D7"
greenTextColor = "#1E6B34"   # AA contrast on its tinted background (17 Oct 2026 check)
grayTextColor = "#5F6470"    # :gray[...] text, e.g. the role under the user name

[theme.light.sidebar]
backgroundColor = "#F1EFE9"
secondaryBackgroundColor = "#E8E5DC"

[client]
toolbarMode = "viewer"

[browser]
gatherUsageStats = false
