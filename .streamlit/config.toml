# Calm theme in two modes; viewers switch with the menu (⋮ > Settings).
# Colour carries meaning (see dashboard/theme.py): sage = good,
# mustard = warning, coral = high severity, lavender = AI, blue = rules.
# Accent shades differ per mode so text keeps AA contrast.

[theme]
font = "sans-serif"
baseFontSize = 15
baseRadius = "large"
showWidgetBorder = true

[theme.dark]
primaryColor = "#8FC9B4"
backgroundColor = "#0E1013"
secondaryBackgroundColor = "#1B1F27"
textColor = "#E8EAEF"
linkColor = "#86AEF7"
borderColor = "#272C35"

[theme.dark.sidebar]
backgroundColor = "#121419"
secondaryBackgroundColor = "#1B1F27"

[theme.light]
primaryColor = "#2E7D63"
backgroundColor = "#F7F6F2"
secondaryBackgroundColor = "#EFEDE6"
textColor = "#1E2127"
linkColor = "#2F64C8"
borderColor = "#E3E0D7"

[theme.light.sidebar]
backgroundColor = "#F1EFE9"
secondaryBackgroundColor = "#E8E5DC"

[client]
toolbarMode = "viewer"

[browser]
gatherUsageStats = false
